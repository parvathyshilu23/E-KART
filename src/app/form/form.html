<div class="container my-5">

  <div class="form-wrapper">

    <h2 class="text-center mb-4">Get in Touch</h2>

    <p class="text-center sub-text">
      We usually respond within 24 hours
    </p>

    <form class="contact-form">

      <div class="row g-3">

        <div class="col-md-6">
          <label>Full Name</label>
          <input type="text" class="form-control" placeholder="Your name">
        </div>

        <div class="col-md-6">
          <label>Email</label>
          <input type="email" class="form-control" placeholder="example@gmail.com">
        </div>

        <div class="col-md-6">
          <label>Phone</label>
          <input type="tel" class="form-control" placeholder="+91...">
        </div>

        <div class="col-md-6">
          <label>Subject</label>
          <input type="text" class="form-control" placeholder="Type subject">
        </div>

        <div class="col-12">
          <label>Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message here"></textarea>
        </div>

      </div>

      <!-- SUBMIT BUTTON -->
      <div class="text-center mt-4">
        <button type="submit" class="btn submit-btn">
          Send Message
        </button>
      </div>

    </form>

  </div>

</div>
